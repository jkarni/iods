<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kick Butt & Take Names - FPS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    #name-tags {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-family: sans-serif;
    }
    .name-tag {
      background: rgba(255,255,255,0.2);
      margin: 0.25rem;
      padding: 0.25rem 0.5rem;
      display: inline-block;
      border-radius: 4px;
    }
    @keyframes popout {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>👢 Kick Butt & Take Names 🏷️</h1>
    <p id="status">Use arrow keys to move and press SPACE to kick!</p>
    <p id="win-message" style="display:none; color:lime">You kicked all the butts and took all the names!</p>
  </div>
  <div id="name-tags"></div>
  <script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const textureLoader = new THREE.TextureLoader();
const floorTexture = textureLoader.load('https://threejsfundamentals.org/threejs/resources/images/checker.png');
floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(20, 20);

const wallTexture = textureLoader.load('./wall.jpg');
wallTexture.wrapS = wallTexture.wrapT = THREE.RepeatWrapping;
wallTexture.repeat.set(4, 2);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 1.6, 0);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.background = new THREE.Color(0x111122);

const ambientLight = new THREE.AmbientLight(0xffffff, 1);
const pointLight = new THREE.PointLight(0xffffff, 2, 200);
pointLight.position.set(10, 10, 10);
scene.add(ambientLight, pointLight);

for (let i = -32; i <= 32; i += 16) {
  for (let j = -32; j <= 32; j += 16) {
    const light = new THREE.PointLight(0xffffff, 1, 40);
    light.position.set(i, 9.5, j);
    scene.add(light);
    const tube = new THREE.Mesh(
      new THREE.BoxGeometry(1.2, 0.1, 0.2),
      new THREE.MeshBasicMaterial({ color: 0xffffee })
    );
    tube.position.copy(light.position);
    scene.add(tube);
  }
}

const labFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ map: floorTexture })
);
labFloor.rotation.x = -Math.PI / 2;
labFloor.receiveShadow = true;
scene.add(labFloor);

const wallMaterial = new THREE.MeshStandardMaterial({ map: wallTexture });
const wall1 = new THREE.Mesh(new THREE.BoxGeometry(80, 10, 1), wallMaterial);
wall1.position.set(0, 5, -40);
scene.add(wall1);
const wall2 = new THREE.Mesh(new THREE.BoxGeometry(80, 10, 1), wallMaterial);
wall2.position.set(0, 5, 40);
scene.add(wall2);
const wall3 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 80), wallMaterial);
wall3.position.set(-40, 5, 0);
scene.add(wall3);
const wall4 = new THREE.Mesh(new THREE.BoxGeometry(1, 10, 80), wallMaterial);
wall4.position.set(40, 5, 0);
scene.add(wall4);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: wallTexture }));
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 10;
scene.add(ceiling);

// === ENEMY AND GAMEPLAY LOGIC ===
const enemies = [];
const enemyClothes = [0x990000, 0x3366cc, 0x339966, 0xcc3333, 0x9933cc];
const enemyNames = ["Chad", "Mildred", "Baron", "Sally", "Greg"];

for (let i = 0; i < enemyNames.length; i++) {
  const enemy = new THREE.Group();
  const clothColor = new THREE.MeshStandardMaterial({ color: enemyClothes[i % enemyClothes.length] });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 16), clothColor);
  body.position.y = 0.75;
  enemy.add(body);

  const skinTone = new THREE.MeshStandardMaterial({ color: [0xffccaa, 0xffe0bd, 0xf1c27d, 0xe0ac69, 0x8d5524][i % 5] });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.3), skinTone);
  head.position.y = 1.65;
  enemy.add(head);

  const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1), clothColor);
  leftArm.position.set(-0.6, 1.2, 0);
  leftArm.rotation.z = Math.PI / 4;
  enemy.add(leftArm);

  const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 1), clothColor);
  rightArm.position.set(0.6, 1.2, 0);
  rightArm.rotation.z = -Math.PI / 4;
  enemy.add(rightArm);

  const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1), clothColor);
  leftLeg.position.set(-0.2, 0.5, 0);
  enemy.add(leftLeg);

  const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1), clothColor);
  rightLeg.position.set(0.2, 0.5, 0);
  enemy.add(rightLeg);

  const eyeWhite = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  eyeWhite.position.set(0, 1.72, 0.29);
  enemy.add(eyeWhite);

  const pupils = new THREE.Mesh(new THREE.PlaneGeometry(0.05, 0.05), new THREE.MeshBasicMaterial({ color: 0x000000 }));
  pupils.position.set(0, 1.72, 0.3);
  enemy.add(pupils);

  const tagCanvas = document.createElement('canvas');
  const tagCtx = tagCanvas.getContext('2d');
  tagCanvas.width = 256;
  tagCanvas.height = 64;
  tagCtx.fillStyle = 'white';
  tagCtx.fillRect(0, 0, tagCanvas.width, tagCanvas.height);
  tagCtx.fillStyle = 'black';
  tagCtx.font = '24px sans-serif';
  tagCtx.textAlign = 'center';
  tagCtx.textBaseline = 'middle';
  tagCtx.fillText(enemyNames[i], tagCanvas.width / 2, tagCanvas.height / 2);
  const tagTexture = new THREE.CanvasTexture(tagCanvas);
  const nameTag = new THREE.Mesh(
    new THREE.PlaneGeometry(0.6, 0.2),
    new THREE.MeshBasicMaterial({ map: tagTexture, transparent: true })
  );
  nameTag.name = "nameTag";
  nameTag.position.set(0, 1.4, 0.35);
  enemy.add(nameTag);

  enemy.userData = { name: enemyNames[i], kicked: false, nameTaken: false, nameTag };
  enemy.position.set(Math.random() * 60 - 30, 0, Math.random() * 60 - 30);
  scene.add(enemy);
  enemies.push(enemy);
}

const velocity = new THREE.Vector3();
const move = { forward: false, back: false };
let rotationLeft = false;
let rotationRight = false;

document.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowUp') move.forward = true;
  if (e.code === 'ArrowDown') move.back = true;
  if (e.code === 'ArrowLeft') rotationLeft = true;
  if (e.code === 'ArrowRight') rotationRight = true;
  if (e.code === 'Space') kick();
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowUp') move.forward = false;
  if (e.code === 'ArrowDown') move.back = false;
  if (e.code === 'ArrowLeft') rotationLeft = false;
  if (e.code === 'ArrowRight') rotationRight = false;
});

function kick() {
  // Kick animation: briefly move camera forward and back
  const originalZ = camera.position.z;
  camera.position.z -= 0.3;
  setTimeout(() => camera.position.z = originalZ, 100);
  const range = 3;
  for (const enemy of enemies) {
    const dist = camera.position.distanceTo(enemy.position);
    if (!enemy.userData.kicked && dist < range) {
      enemy.children.forEach(c => { if (c.material?.color) c.material.color.set(0x444444); });
      enemy.userData.kicked = true;
      document.getElementById("status").innerText = `You kicked ${enemy.userData.name}'s butt! Press SPACE again to take their name tag.`;
      return;
    } else if (enemy.userData.kicked && !enemy.userData.nameTaken && dist < range) {
      enemy.userData.nameTaken = true;
      if (enemy.getObjectByName("nameTag")) enemy.remove(enemy.userData.nameTag);

      const tag = document.createElement("div");
      tag.className = "name-tag";
      tag.textContent = enemy.userData.name;
      document.getElementById("name-tags").appendChild(tag);

      const star = document.createElement("div");
      star.style.position = "absolute";
      star.style.top = "40%";
      star.style.left = "50%";
      star.style.transform = "translate(-50%, -50%)";
      star.style.fontSize = "2rem";
      star.style.color = "gold";
      star.style.animation = "popout 1s ease-out forwards";
      star.innerHTML = "⭐ Supa points!";
      document.body.appendChild(star);
      setTimeout(() => star.remove(), 1000);

      const audio = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_2f6bfcf4f1.mp3?filename=success-fanfare-trumpets-6185.mp3");
      audio.volume = 0.6;
      audio.play();

      const remaining = enemies.filter(e => !e.userData.nameTaken);
      if (remaining.length === 0) {
        document.getElementById("status").style.display = "none";
        document.getElementById("win-message").style.display = "block";
        setTimeout(() => {
          document.body.innerHTML = '';
          const bananaPile = document.createElement('div');
          bananaPile.style.position = 'fixed';
          bananaPile.style.top = '50%';
          bananaPile.style.left = '50%';
          bananaPile.style.transform = 'translate(-50%, -50%)';
          bananaPile.style.fontSize = '3rem';
          bananaPile.style.textAlign = 'center';
          bananaPile.innerHTML = `
            🍌<br>
            🍌🍌<br>
            🍌🍌🍌<br>
            🍌🍌🍌🍌<br>
            🍌🍌<span style="font-size: 4rem">🍌</span>🍌<br><br>
            <strong style="color: gold">You are top banana!</strong>
          `;
          document.body.appendChild(bananaPile);
        }, 2000);
      } else {
        document.getElementById("status").innerText = `Enemy nearby: ${remaining[0].userData.name}`;
      }
      return;
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const speed = 0.1;
  const turnSpeed = 0.03;
  if (rotationLeft) camera.rotation.y += turnSpeed;
  if (rotationRight) camera.rotation.y -= turnSpeed;
  velocity.set(0, 0, 0);
  if (move.forward) velocity.z = -speed;
  if (move.back) velocity.z = speed;
  const direction = new THREE.Vector3(velocity.x, velocity.y, velocity.z);
  direction.applyEuler(camera.rotation);
  camera.position.add(direction);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
